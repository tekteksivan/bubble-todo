<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crystal Aqua Bubble ToDo</title>
<style>
  :root {
    --bg-lagoon: linear-gradient(135deg, #54a5db 0%, #48c0d3 45%, #4dc2aa 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg-lagoon);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    user-select: none;
    position: relative;
  }

  /* 背景の装飾泡 */
  .bg-bubbles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }
  .ambient-bubble {
    position: absolute;
    bottom: -130px;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.22) 38%, rgba(200, 245, 255, 0.18) 70%, rgba(255, 255, 255, 0.4) 100%);
    border: 1.5px solid rgba(255, 255, 255, 0.6);
    box-shadow: 
      inset 0 0 14px rgba(255, 255, 255, 0.65),
      0 8px 20px rgba(10, 60, 90, 0.22);
    animation: riseUp linear infinite;
  }
  .ambient-bubble::before {
    content: '';
    position: absolute;
    top: 14%;
    left: 20%;
    width: 30%;
    height: 20%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, transparent 80%);
    transform: rotate(-30deg);
  }

  @keyframes riseUp {
    0% { transform: translateY(0) translateX(0) scale(0.95); opacity: 0; }
    15% { opacity: 0.9; }
    85% { opacity: 0.9; }
    100% { transform: translateY(-115vh) translateX(35px) scale(1.1); opacity: 0; }
  }

  /* 上部入力コントロール */
  #header-dock {
    position: fixed;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1.5px solid rgba(255, 255, 255, 0.95);
    padding: 8px 18px;
    border-radius: 40px;
    display: flex;
    gap: 12px;
    align-items: center;
    box-shadow: 0 10px 28px rgba(10, 50, 80, 0.2), inset 0 1px 2px rgba(255, 255, 255, 1);
    z-index: 1000;
  }
  #task-input {
    background: transparent;
    border: none;
    outline: none;
    color: #0f172a;
    font-size: 14px;
    font-weight: 600;
    width: 210px;
  }
  #task-input::placeholder { color: #64748b; font-weight: normal; }

  .pill-group {
    display: flex;
    background: rgba(225, 240, 248, 0.7);
    border-radius: 20px;
    padding: 3px;
    gap: 2px;
    border: 1px solid rgba(255, 255, 255, 0.85);
  }
  .pill-btn {
    border: none;
    padding: 5px 12px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    background: transparent;
    color: #475569;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .pill-btn.active.my { background: #059669; color: #fff; box-shadow: 0 2px 8px rgba(5, 150, 105, 0.35); }
  .pill-btn.active.wait { background: #0284c7; color: #fff; box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35); }
  .pill-btn.active.urgent { background: #d97706; color: #fff; box-shadow: 0 2px 8px rgba(217, 119, 6, 0.35); }
  .pill-btn.active.normal { background: #fff; color: #0f172a; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }

  #add-btn {
    background: linear-gradient(135deg, #059669, #0284c7);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 6px 18px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(2, 132, 199, 0.35);
    transition: transform 0.15s;
  }
  #add-btn:hover { transform: scale(1.05); }

  /* 右上ステータス＆設定ボタン */
  #sync-badge {
    position: fixed;
    top: 24px;
    right: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 1000;
  }
  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 8px #10b981;
  }
  .status-dot.syncing { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; animation: pulse 1s infinite; }
  .status-dot.error { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
  .icon-btn {
    background: rgba(255, 255, 255, 0.82);
    border: 1.5px solid rgba(255, 255, 255, 0.95);
    color: #0f172a;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 12px rgba(10, 50, 80, 0.15);
    transition: transform 0.2s;
  }
  .icon-btn:hover { transform: scale(1.08); background: #fff; }

  /* タスクの泡 */
  .bubble {
    position: absolute;
    border-radius: 50%;
    cursor: grab;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px;
    text-align: center;
    color: #0f172a;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 50;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    touch-action: none;
  }
  .bubble:hover { transform: scale(1.08); }
  .bubble.dragging {
    cursor: grabbing !important;
    transform: scale(1.15) !important;
    transition: none !important;
    z-index: 200 !important;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3) !important;
  }

  .bubble.popping {
    pointer-events: none !important;
    animation: bubblePopEffect 0.18s cubic-bezier(0.1, 0.9, 0.2, 1) forwards !important;
  }
  @keyframes bubblePopEffect {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.28); opacity: 0.9; }
    100% { transform: scale(1.45); opacity: 0; filter: blur(4px); }
  }

  .bubble::before {
    content: '';
    position: absolute;
    top: 10%;
    left: 18%;
    width: 34%;
    height: 24%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.3) 60%, transparent 90%);
    transform: rotate(-35deg);
    pointer-events: none;
  }
  .bubble::after {
    content: '';
    position: absolute;
    bottom: 12%;
    right: 20%;
    width: 28%;
    height: 18%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.65) 0%, transparent 80%);
    pointer-events: none;
  }

  /* 1. 自分のボール（通常） */
  .bubble.my.normal {
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, #c1f7da 35%, #42dc9c 75%, #059669 100%);
    border: 3px solid #ffffff;
    box-shadow: 
      inset 0 0 20px rgba(255, 255, 255, 0.8),
      inset -6px -6px 14px rgba(5, 150, 105, 0.4),
      0 12px 28px rgba(5, 60, 45, 0.35);
  }

  /* 2. 最優先（🔥） */
  .bubble.my.urgent,
  .bubble.wait.urgent {
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, #fef3c7 30%, #fbbf24 70%, #d97706 100%);
    border: 3px solid #ffffff;
    box-shadow: 
      inset 0 0 24px rgba(255, 255, 255, 0.9),
      inset -6px -6px 14px rgba(180, 83, 9, 0.4),
      0 14px 30px rgba(60, 30, 5, 0.35),
      0 0 16px rgba(251, 191, 36, 0.5);
  }

  /* 3. 相手待ち */
  .bubble.wait.normal {
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, #c8edfd 35%, #44bbf2 75%, #0284c7 100%);
    border: 3px solid #ffffff;
    box-shadow: 
      inset 0 0 20px rgba(255, 255, 255, 0.8),
      inset -6px -6px 14px rgba(2, 132, 199, 0.4),
      0 12px 28px rgba(10, 45, 75, 0.35);
  }

  .bubble-badge {
    font-size: 11px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.92);
    color: #0f172a;
    margin-bottom: 6px;
    letter-spacing: 0.03em;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
    pointer-events: none;
  }
  .bubble-text {
    font-size: 15px;
    font-weight: 800;
    line-height: 1.35;
    color: #0f172a;
    word-break: break-all;
    max-width: 85%;
    text-shadow: 0 1px 3px rgba(255, 255, 255, 0.8);
    pointer-events: none;
  }

  .sparkle {
    position: absolute;
    pointer-events: none;
    border-radius: 50%;
    z-index: 1000;
  }

  /* 設定モーダル */
  #settings-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 40, 60, 0.45);
    backdrop-filter: blur(10px);
    z-index: 2000;
    align-items: center;
    justify-content: center;
  }
  .modal-box {
    background: #ffffff;
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    border-radius: 24px;
    padding: 26px;
    width: 390px;
    box-shadow: 0 24px 50px rgba(10, 50, 80, 0.25);
    color: #0f172a;
  }
  .modal-box h3 { font-size: 17px; margin-bottom: 16px; font-weight: 800; }
  .modal-box label { font-size: 12px; font-weight: 700; color: #475569; display: block; margin-top: 12px; }
  .modal-box input {
    width: 100%;
    margin-top: 5px;
    background: #f8fafc;
    border: 1.5px solid #cbd5e1;
    color: #0f172a;
    padding: 9px 12px;
    border-radius: 10px;
    font-size: 13px;
    outline: none;
  }
  .modal-box input:focus { border-color: #0284c7; background: #fff; }
  .modal-actions { margin-top: 22px; display: flex; justify-content: flex-end; gap: 10px; }
  .modal-btn {
    border: none;
    padding: 7px 16px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 700;
  }
  .modal-btn.cancel { background: #e2e8f0; color: #475569; }
  .modal-btn.primary { background: linear-gradient(135deg, #059669, #0284c7); color: #fff; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
</style>
</head>
<body>

<div class="bg-bubbles" id="bg-bubbles"></div>

<div id="header-dock">
  <input type="text" id="task-input" placeholder="タスクを入力 (Enterで浮かべる)">
  
  <div class="pill-group">
    <button class="pill-btn active my" id="p-my" onclick="setBall('my')">● 自分</button>
    <button class="pill-btn wait" id="p-wait" onclick="setBall('wait')">⏳ 相手</button>
  </div>

  <div class="pill-group">
    <button class="pill-btn active normal" id="p-normal" onclick="setPriority('normal')">通常</button>
    <button class="pill-btn urgent" id="p-urgent" onclick="setPriority('urgent')">🔥 最優先</button>
  </div>

  <button id="add-btn" onclick="addTask()">浮かべる</button>
</div>

<div id="sync-badge">
  <div class="status-dot" id="sync-dot" title="同期完了"></div>
  <button class="icon-btn" onclick="openSettings()" title="同期設定">⚙️</button>
</div>

<div id="settings-modal">
  <div class="modal-box">
    <h3>🔗 Googleスプレッドシート連携</h3>
    <label>GAS ウェブアプリURL</label>
    <input type="text" id="cfg-url" placeholder="https://script.google.com/macros/s/.../exec">
    <label>合言葉（シークレットキー）</label>
    <input type="password" id="cfg-key" placeholder="スクリプトに書いた合言葉">
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeSettings()">キャンセル</button>
      <button class="modal-btn primary" onclick="saveSettings()">接続・保存</button>
    </div>
  </div>
</div>

<script>
  let tasks = [];
  let currentBall = 'my';
  let currentPriority = 'normal';

  let gasUrl = localStorage.getItem('bubble_gas_url') || '';
  let secretKey = localStorage.getItem('bubble_gas_key') || '';

  const syncDot = document.getElementById('sync-dot');

  function initAmbientBubbles() {
    const container = document.getElementById('bg-bubbles');
    const count = 15;
    for (let i = 0; i < count; i++) {
      const b = document.createElement('div');
      b.className = 'ambient-bubble';
      const size = Math.random() * 60 + 30;
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = Math.random() * 95 + '%';
      b.style.animationDuration = (Math.random() * 12 + 11) + 's';
      b.style.animationDelay = (Math.random() * 10) + 's';
      container.appendChild(b);
    }
  }
  initAmbientBubbles();

  function setBall(val) {
    currentBall = val;
    document.getElementById('p-my').classList.toggle('active', val === 'my');
    document.getElementById('p-wait').classList.toggle('active', val === 'wait');
  }

  function setPriority(val) {
    currentPriority = val;
    document.getElementById('p-normal').classList.toggle('active', val === 'normal');
    document.getElementById('p-urgent').classList.toggle('active', val === 'urgent');
  }

  document.getElementById('task-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  function addTask() {
    const input = document.getElementById('task-input');
    const text = input.value.trim();
    if (!text) return;

    const baseSize = currentPriority === 'urgent' ? 150 : 130;
    const task = {
      id: "t_" + Date.now(),
      text: text,
      ball: currentBall, // 'my' または 'wait'
      priority: currentPriority,
      date: new Date().toLocaleDateString('ja-JP'),
      x: Math.random() * (window.innerWidth - 200) + 50,
      y: Math.random() * (window.innerHeight - 300) + 120,
      vx: (Math.random() - 0.5) * 0.7,
      vy: (Math.random() - 0.5) * 0.7,
      size: Math.max(baseSize, Math.min(200, text.length * 8 + baseSize - 30)),
      isDragging: false
    };

    tasks.push(task);
    createBubbleElement(task);
    input.value = '';
    syncToCloud();
  }

  function createBubbleElement(t) {
    const b = document.createElement('div');
    b.className = `bubble ${t.ball} ${t.priority}`;
    b.id = 'node-' + t.id;
    b.style.width = t.size + 'px';
    b.style.height = t.size + 'px';

    const isMy = (t.ball === 'my');
    const isUrgent = (t.priority === 'urgent');
    const badgeLabel = (isUrgent ? '🔥 ' : '') + (isMy ? '自分' : '相手待ち');
    b.innerHTML = `
      <span class="bubble-badge">${badgeLabel}</span>
      <span class="bubble-text">${escapeHtml(t.text)}</span>
    `;

    let startX = 0, startY = 0;
    let initialBubbleX = 0, initialBubbleY = 0;
    let hasMoved = false;

    const onPointerDown = (e) => {
      if (e.button && e.button !== 0) return;

      const clientX = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
      const clientY = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;

      startX = clientX;
      startY = clientY;
      initialBubbleX = t.x;
      initialBubbleY = t.y;
      hasMoved = false;

      const onPointerMove = (moveEv) => {
        const curX = (moveEv.touches && moveEv.touches[0]) ? moveEv.touches[0].clientX : moveEv.clientX;
        const curY = (moveEv.touches && moveEv.touches[0]) ? moveEv.touches[0].clientY : moveEv.clientY;
        const dx = curX - startX;
        const dy = curY - startY;

        if (!hasMoved && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
          hasMoved = true;
          t.isDragging = true;
          b.classList.add('dragging');
        }

        if (hasMoved) {
          t.x = initialBubbleX + dx;
          t.y = initialBubbleY + dy;
          b.style.left = t.x + 'px';
          b.style.top = t.y + 'px';
        }
      };

      const onPointerUp = (upEv) => {
        window.removeEventListener('mousemove', onPointerMove);
        window.removeEventListener('mouseup', onPointerUp);
        window.removeEventListener('touchmove', onPointerMove);
        window.removeEventListener('touchend', onPointerUp);

        if (hasMoved) {
          t.isDragging = false;
          b.classList.remove('dragging');
        } else {
          const rect = b.getBoundingClientRect();
          const popX = rect.left + rect.width / 2;
          const popY = rect.top + rect.height / 2;
          popBubble(t.id, popX, popY, t.priority);
        }
      };

      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);
      window.addEventListener('touchmove', onPointerMove, { passive: false });
      window.addEventListener('touchend', onPointerUp);
    };

    b.addEventListener('mousedown', onPointerDown);
    b.addEventListener('touchstart', onPointerDown, { passive: false });

    // 右クリックで「自分 ⇄ 相手待ち」切り替え
    b.oncontextmenu = (e) => {
      e.preventDefault();
      t.ball = (t.ball === 'my') ? 'wait' : 'my';
      b.className = `bubble ${t.ball} ${t.priority}`;
      b.querySelector('.bubble-badge').textContent = 
        (t.priority === 'urgent' ? '🔥 ' : '') + (t.ball === 'my' ? '自分' : '相手待ち');
      syncToCloud();
    };

    document.body.appendChild(b);
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
  }

  function popBubble(id, x, y, priority) {
    playChime(priority === 'urgent');

    const particleColor = priority === 'urgent' ? '#fbbf24' : '#38bdf8';
    createParticles(x, y, particleColor);

    const el = document.getElementById('node-' + id);
    if (el) {
      el.classList.add('popping');
      setTimeout(() => {
        el.remove();
      }, 160);
    }

    tasks = tasks.filter(t => t.id !== id);
    syncToCloud();
  }

  function playChime(isUrgent) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      
      const pop = ctx.createOscillator();
      const popGain = ctx.createGain();
      pop.frequency.setValueAtTime(460, now);
      pop.frequency.exponentialRampToValueAtTime(90, now + 0.06);
      popGain.gain.setValueAtTime(0.45, now);
      popGain.gain.exponentialRampToValueAtTime(0.01, now + 0.06);
      pop.connect(popGain);
      popGain.connect(ctx.destination);
      pop.start(now);
      pop.stop(now + 0.07);

      const notes = isUrgent ? [587.33, 739.99, 880.00, 1174.66] : [523.25, 659.25, 783.99];
      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.035);
        gain.gain.setValueAtTime(0.2, now + idx * 0.035);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.035 + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + idx * 0.035);
        osc.stop(now + idx * 0.035 + 0.47);
      });
    } catch(e) {}
  }

  function createParticles(x, y, color) {
    for (let i = 0; i < 24; i++) {
      const p = document.createElement('div');
      p.className = 'sparkle';
      const size = Math.random() * 8 + 4;
      p.style.width = size + 'px';
      p.style.height = size + 'px';
      p.style.background = color;
      p.style.boxShadow = `0 0 12px ${color}, 0 0 4px #ffffff`;
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      document.body.appendChild(p);

      const angle = Math.random() * Math.PI * 2;
      const dist = Math.random() * 110 + 40;
      const destX = x + Math.cos(angle) * dist;
      const destY = y + Math.sin(angle) * dist;

      p.animate([
        { transform: 'translate(0, 0) scale(1.4)', opacity: 1 },
        { transform: `translate(${destX - x}px, ${destY - y}px) scale(0)`, opacity: 0 }
      ], { duration: 480, easing: 'cubic-bezier(0, .8, .5, 1)' }).onfinish = () => p.remove();
    }
  }

  // クラウドへ保存（常に確実に 'my' / 'wait' の正規化キーを送信）
  async function syncToCloud() {
    if (!gasUrl || !secretKey) return;
    syncDot.className = 'status-dot syncing';

    const normalizedTasks = tasks.map(t => ({
      id: t.id,
      text: t.text,
      ball: (t.ball === 'my' || t.ball === '自分') ? 'my' : 'wait',
      priority: (t.priority === 'urgent' || t.priority === '最優先') ? 'urgent' : 'normal',
      date: t.date || ''
    }));

    try {
      const res = await fetch(gasUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ key: secretKey, tasks: normalizedTasks })
      });
      const data = await res.json();
      if (data.status === 'success') {
        syncDot.className = 'status-dot';
      } else {
        syncDot.className = 'status-dot error';
      }
    } catch (e) {
      syncDot.className = 'status-dot error';
    }
  }

  // クラウドから読み込み（表記揺れガード）
  async function loadFromCloud() {
    if (!gasUrl || !secretKey) {
      openSettings();
      return;
    }
    syncDot.className = 'status-dot syncing';
    try {
      const res = await fetch(`${gasUrl}?key=${encodeURIComponent(secretKey)}`);
      const data = await res.json();
      if (Array.isArray(data)) {
        document.querySelectorAll('.bubble').forEach(el => el.remove());
        tasks = data.map(t => {
          const rawBall = String(t.ball || '').trim();
          const rawPriority = String(t.priority || '').trim();

          // 「自分」「my」という文字が含まれていればすべて確実に 'my' とする
          const isMy = (rawBall === 'my' || rawBall.includes('自分'));
          const isUrgent = (rawPriority === 'urgent' || rawPriority.includes('最優先'));

          const ballKey = isMy ? 'my' : 'wait';
          const priorityKey = isUrgent ? 'urgent' : 'normal';

          const baseSize = priorityKey === 'urgent' ? 150 : 130;
          return {
            id: t.id || ("t_" + Date.now() + Math.random()),
            text: t.text || '',
            ball: ballKey,
            priority: priorityKey,
            date: t.date || '',
            x: Math.random() * (window.innerWidth - 200) + 50,
            y: Math.random() * (window.innerHeight - 300) + 120,
            vx: (Math.random() - 0.5) * 0.7,
            vy: (Math.random() - 0.5) * 0.7,
            size: Math.max(baseSize, Math.min(200, (t.text || '').length * 8 + baseSize - 30)),
            isDragging: false
          };
        });
        tasks.forEach(createBubbleElement);
        syncDot.className = 'status-dot';
      } else {
        syncDot.className = 'status-dot error';
      }
    } catch (e) {
      syncDot.className = 'status-dot error';
    }
  }

  function animate() {
    tasks.forEach(t => {
      if (!t.isDragging) {
        t.x += t.vx;
        t.y += t.vy;

        if (t.x < 15 || t.x > window.innerWidth - t.size - 15) t.vx *= -1;
        if (t.y < 90 || t.y > window.innerHeight - t.size - 15) t.vy *= -1;

        const el = document.getElementById('node-' + t.id);
        if (el) {
          el.style.left = t.x + 'px';
          el.style.top = t.y + 'px';
        }
      }
    });
    requestAnimationFrame(animate);
  }

  function openSettings() {
    document.getElementById('cfg-url').value = gasUrl;
    document.getElementById('cfg-key').value = secretKey;
    document.getElementById('settings-modal').style.display = 'flex';
  }
  function closeSettings() {
    document.getElementById('settings-modal').style.display = 'none';
  }
  function saveSettings() {
    gasUrl = document.getElementById('cfg-url').value.trim();
    secretKey = document.getElementById('cfg-key').value.trim();
    localStorage.setItem('bubble_gas_url', gasUrl);
    localStorage.setItem('bubble_gas_key', secretKey);
    closeSettings();
    loadFromCloud();
  }

  animate();
  loadFromCloud();
</script>
</body>
</html>
